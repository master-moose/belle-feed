<div id="belle-feed-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1a1a1a; line-height: 1.6; max-width: 100%;">
  <div id="belle-feed-content" style="display: flex; flex-direction: column; gap: 2rem;">
    <!-- Skeleton loaders while loading -->
    <div id="belle-feed-skeleton" style="display: flex; flex-direction: column; gap: 2rem;">
      <div style="height: 150px; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 2s infinite; border-radius: 4px;"></div>
      <div style="height: 150px; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 2s infinite; border-radius: 4px; animation-delay: 0.3s;"></div>
      <div style="height: 150px; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 2s infinite; border-radius: 4px; animation-delay: 0.6s;"></div>
    </div>

    <!-- Articles list (hidden initially) -->
    <div id="belle-feed-articles" style="display: none;"></div>

    <!-- Error message (hidden initially) -->
    <div id="belle-feed-error" style="display: none; color: #666; font-size: 0.95rem;">
      Articles temporarily unavailable.
    </div>
  </div>
</div>

<style>
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .belle-article {
    padding: 1.5rem 0;
    border-bottom: 1px solid #e0e0e0;
  }

  .belle-article:last-child {
    border-bottom: none;
  }

  .belle-article-source {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .belle-article-source.substack {
    color: #f0386b;
  }

  .belle-article-source.ec {
    color: #e63946;
  }

  .belle-article-date {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 0.75rem;
  }

  .belle-article-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 0.75rem 0;
    color: #111;
    line-height: 1.4;
  }

  .belle-article-excerpt {
    font-size: 1rem;
    color: #333;
    margin-bottom: 1rem;
    line-height: 1.6;
  }

  .belle-article-link {
    display: inline-block;
    color: #0066cc;
    text-decoration: none;
    font-size: 0.95rem;
  }

  .belle-article-link:hover {
    text-decoration: underline;
  }
</style>

<script>
  (function() {
    const FEED_URL = 'https://raw.githubusercontent.com/master-moose/belle-feed/main/public/articles.json';
    const container = document.getElementById('belle-feed-articles');
    const skeleton = document.getElementById('belle-feed-skeleton');
    const errorEl = document.getElementById('belle-feed-error');
    const contentEl = document.getElementById('belle-feed-content');

    async function fetchAndRender() {
      try {
        const response = await fetch(FEED_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (!data.articles || data.articles.length === 0) {
          throw new Error('No articles found');
        }

        // Hide skeleton, show articles
        skeleton.style.display = 'none';
        errorEl.style.display = 'none';
        container.style.display = 'block';

        // Render articles
        data.articles.forEach(article => {
          const sourceClass = article.source === 'substack' ? 'substack' : 'ec';
          const dateStr = new Date(article.date).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const articleEl = document.createElement('div');
          articleEl.className = 'belle-article';
          articleEl.innerHTML = `
            <div class="belle-article-source ${sourceClass}">${article.sourceLabel}</div>
            <div class="belle-article-date">${dateStr}</div>
            <h3 class="belle-article-title">${escapeHtml(article.title)}</h3>
            <p class="belle-article-excerpt">${escapeHtml(article.excerpt)}</p>
            <a href="${article.url}" target="_blank" rel="noopener noreferrer" class="belle-article-link">
              Read on ${article.sourceLabel} →
            </a>
          `;
          container.appendChild(articleEl);
        });

      } catch (error) {
        console.error('Failed to fetch articles:', error);
        skeleton.style.display = 'none';
        container.style.display = 'none';
        errorEl.style.display = 'block';
      }
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Fetch on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fetchAndRender);
    } else {
      fetchAndRender();
    }
  })();
</script>
